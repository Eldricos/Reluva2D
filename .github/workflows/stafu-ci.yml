name: STAFU CI
on:
  push:
    branches: [feature/stafu-engine]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-ci -G "Visual Studio 17 2022" -A x64 -DRELUVA_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build-ci --config Debug --parallel 4
      - name: Test
        run: ctest --test-dir build-ci -C Debug --output-on-failure --output-junit stafu-ctest.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stafu-ctest-report
          path: build-ci/stafu-ctest.xml
          if-no-files-found: warn
